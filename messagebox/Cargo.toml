[package]
name = "messagebox"
version = "0.1.2-beta.2"
edition = "2021"
license = "EUPL-1.2"
description = "Service to connect people and machines"
publish=false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.8.0"
actix-web-actors = "4"
actix = "0.13"
serde_json = "1.0.96"
keri-sdk = { git = "https://github.com/THCLab/keriox.git", branch = "development" }
cesrox = { version = "2.0.0-beta.5", features = ["cesr-proof"] }
url = "2.4.0"
thiserror = "2.0"
figment = { version = "0.10.6", features = ["yaml", "env"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.1.1", features = ["derive"] }
anyhow = { version = "1.0.56" }
tokio = {version = "1.29.1", features = ["sync", "rt", "macros", "rt-multi-thread", "time"]}
ureq = {version = "3.3", features = ["json"]}
redb = "4.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dauthz-core = { git = "https://github.com/THCLab/DauthZ.git", branch = "master" }
dauthz-server = { git = "https://github.com/THCLab/DauthZ.git", branch = "master" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2 = "0.11"
utoipa = { version = "5", features = ["actix_extras"] }

[dev-dependencies]
tempfile = "3.8.1"
serde_yaml = "0.9"

[package.metadata.release]
publish=false
tag=true
tag-name="v{{version}}"
pre-release-hook = ["git", "cliff", "--tag", "{{version}}", "-r", "../", "--output", "../CHANGELOG.md" ]
pre-release-commit-message="chore: release {{version}} version"
